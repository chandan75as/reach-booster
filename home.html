<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reach Buster - Main Dashboard</title>
    <style>
        /* Advance Coding Background Theme (Hacker Style) */
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle, #002200 10%, transparent 10%),
                radial-gradient(circle, #002200 10%, transparent 10%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        /* Top Navbar */
        .navbar {
            width: 100%;
            background: rgba(0, 20, 0, 0.9);
            border-bottom: 2px solid #00ff00;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            box-shadow: 0 0 15px #00ff00;
        }

        .navbar h2 {
            margin: 0;
            color: #ffaa00; /* Premium Gold for logo */
            text-shadow: 0 0 10px #ffaa00;
            letter-spacing: 2px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .wallet-box {
            background: #001100;
            border: 1px solid #00ff00;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: inset 0 0 10px #00ff00;
        }

        .logout-btn {
            background: #330000;
            color: #ff3333;
            border: 1px solid #ff3333;
            padding: 8px 15px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #ff3333;
            color: #fff;
            box-shadow: 0 0 10px #ff3333;
        }

        /* Main Dashboard Container */
        .dashboard-container {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 10px;
            margin-top: 40px;
        }

        .dashboard-container h3 {
            border-bottom: 1px dashed #00ff00;
            padding-bottom: 10px;
            margin-top: 0;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            color: #cccccc;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: #001100;
            border: 1px solid #008800;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #00ff00;
            box-shadow: 0 0 8px #00ff00;
        }

        /* Calculator Box */
        .calc-box {
            background: rgba(255, 170, 0, 0.1);
            border: 1px dashed #ffaa00;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            color: #ffaa00;
        }

        .calc-box span {
            font-weight: bold;
            font-size: 22px;
            text-shadow: 0 0 5px #ffaa00;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: #003300;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 20px #00ff00;
        }

        /* Loading Overlay */
        #loadingScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #00ff00; display: flex;
            justify-content: center; align-items: center; z-index: 2000;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- Security Loading Screen -->
    <div id="loadingScreen">
        > SYSTEM_AUTHENTICATING... PLEASE WAIT_
    </div>

    <!-- Top Navigation Bar -->
    <div class="navbar">
        <h2>👑 REACH BUSTER</h2>
        <div class="user-info">
            <div class="wallet-box">
                WALLET: ₹<span id="walletBalance">0.00</span>
            </div>
            <button class="logout-btn" onclick="executeLogout()">[ LOGOUT ]</button>
        </div>
    </div>

    <!-- Main Order Area -->
    <div class="dashboard-container">
        <h3>> INITIATE_NEW_ORDER</h3>
        
        <form id="orderForm" onsubmit="submitOrder(event)">
            
            <div class="input-group">
                <label>> Select Target Service :</label>
                <select id="serviceType" required>
                    <option value="views">Instagram Premium Views (₹100 / 100K)</option>
                    <!-- Future ke liye aur options add kar sakte ho -->
                </select>
            </div>

            <div class="input-group">
                <label>> Target Public Link :</label>
                <input type="url" id="targetLink" placeholder="https://instagram.com/reel/..." required>
            </div>

            <div class="input-group">
                <label>> Enter Quantity (Min 1000) :</label>
                <input type="number" id="orderQuantity" min="1000" placeholder="e.g. 50000" required onkeyup="calculatePrice()">
            </div>

            <!-- Automatic Calculator Box -->
            <div class="calc-box">
                > TOTAL CHARGE: ₹<span id="totalCharge">0.00</span>
            </div>

            <button type="submit" class="submit-btn">EXECUTE_ORDER</button>

        </form>
    </div>

    <!-- ========================================= -->
    <!-- LOGIC & FIREBASE INTEGRATION              -->
    <!-- ========================================= -->
    
    <!-- Calculator Script (Local UI Logic) -->
    <script>
        function calculatePrice() {
            const quantity = document.getElementById('orderQuantity').value;
            const chargeDisplay = document.getElementById('totalCharge');
            
            // Logic: 100,000 views = 100 Rs. So, 1000 views = 1 Rs.
            // Formula: (Quantity / 1000) * 1
            if (quantity && quantity >= 0) {
                const price = (quantity / 1000) * 1; 
                chargeDisplay.innerText = price.toFixed(2);
            } else {
                chargeDisplay.innerText = "0.00";
            }
        }

        function submitOrder(e) {
            e.preventDefault();
            const link = document.getElementById('targetLink').value;
            const quantity = document.getElementById('orderQuantity').value;
            const price = (quantity / 1000) * 1;

            const currentBalance = parseFloat(document.getElementById('walletBalance').innerText);

            if (currentBalance < price) {
                alert("ERROR: Insufficient funds in wallet! Please add ₹" + (price - currentBalance).toFixed(2) + " more.");
            } else {
                alert("ORDER ACCEPTED! Quantity: " + quantity + " | Charge: ₹" + price + "\n\n(Backend API logic pending)");
                // Yahan aap apna API call ka logic lagaoge jo server.js ko request bhejega.
            }
        }
    </script>

    <!-- Firebase Auth Check & Data Fetch Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFpOWJlCYTvlhVijnyOPeVn0wCw7Ev5tI",
            authDomain: "my-cozy-farm.firebaseapp.com",
            databaseURL: "https://my-cozy-farm-default-rtdb.firebaseio.com",
            projectId: "my-cozy-farm",
            storageBucket: "my-cozy-farm.firebasestorage.app",
            messagingSenderId: "680824081334",
            appId: "1:680824081334:web:535cdcb9acdf2fda2d4f17",
            measurementId: "G-LJQXPB6ERL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        // Security Check: Dekho user logged in hai ya nahi
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User logged in hai, loading screen hata do
                document.getElementById('loadingScreen').style.display = 'none';

                // Database se user ka wallet balance fetch karna
                const userRef = ref(database, 'users/' + user.uid);
                onValue(userRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data && data.walletBalance !== undefined) {
                        document.getElementById('walletBalance').innerText = data.walletBalance.toFixed(2);
                    }
                });
            } else {
                // User logged in nahi hai, index.html (login page) par fenk do
                window.location.href = "index.html";
            }
        });

        // Logout Function
        window.executeLogout = function() {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                alert("Error logging out: " + error.message);
            });
        };
    </script>

</body>
</html>
